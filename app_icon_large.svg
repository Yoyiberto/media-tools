<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A7BC8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGradient)" stroke="#2E5A87" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Microphone body -->
  <rect x="112" y="72" width="32" height="64" rx="16" ry="16" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Microphone grille lines -->
  <line x1="120" y1="80" x2="136" y2="80" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="88" x2="136" y2="88" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="96" x2="136" y2="96" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="104" x2="136" y2="104" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="112" x2="136" y2="112" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="120" x2="136" y2="120" stroke="#4A90E2" stroke-width="2"/>
  <line x1="120" y1="128" x2="136" y2="128" stroke="#4A90E2" stroke-width="2"/>
  
  <!-- Microphone stand -->
  <rect x="124" y="136" width="8" height="32" fill="#FFFFFF"/>
  
  <!-- Microphone base -->
  <rect x="104" y="168" width="48" height="8" rx="4" fill="#FFFFFF"/>
  
  <!-- Sound waves -->
  <path d="M 80 104 Q 72 112 72 128 Q 72 144 80 152" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M 176 104 Q 184 112 184 128 Q 184 144 176 152" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.8"/>
  
  <path d="M 64 88 Q 48 104 48 128 Q 48 152 64 168" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 192 88 Q 208 104 208 128 Q 208 152 192 168" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.6"/>
  
  <!-- AI/Tech accent circles -->
  <circle cx="160" cy="96" r="8" fill="#00D4AA" opacity="0.9"/>
  <circle cx="96" cy="160" r="6" fill="#00D4AA" opacity="0.7"/>
  
  <!-- Tech bars -->
  <rect x="152" y="88" width="16" height="4" fill="#00D4AA" opacity="0.6"/>
  <rect x="88" y="152" width="12" height="4" fill="#00D4AA" opacity="0.5"/>
  
  <!-- Small decorative dots -->
  <circle cx="180" cy="80" r="3" fill="#00D4AA" opacity="0.4"/>
  <circle cx="76" cy="176" r="2.5" fill="#00D4AA" opacity="0.4"/>
</svg>
